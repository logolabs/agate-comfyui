[project]
name = "agate-comfyui"
version = "0.4.0"
description = "ComfyUI nodes for Agate, LogoLabs' 260M-parameter text-to-image model (Preview 001, 002 and 003 at 512 px): a single-file loader, a sampler that outputs SD 1.x LATENTs (img2img, live previews), an all-in-one generator, a plan viewer, and AI-output marking (invisible watermark + provenance metadata)."
authors = [{ name = "LogoLabs" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# torch, numpy and Pillow come with ComfyUI and are deliberately not listed.
dependencies = [
    "diffusers>=0.30",
    "transformers>=4.48",
    "safetensors",
    "huggingface_hub",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/logolabs/agate-comfyui"
Documentation = "https://github.com/logolabs/agate-comfyui#readme"
"Bug Tracker" = "https://github.com/logolabs/agate-comfyui/issues"
"Model card" = "https://huggingface.co/Logolabs/agate-preview-003"

[tool.comfy]
# Same Comfy Registry publisher as logolabs/inkvec-comfyui.
PublisherId = "logolabs-org"
DisplayName = "Agate"
